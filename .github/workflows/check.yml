name: check

on:
  push:
  pull_request:

jobs:
  example:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Audit the bundled example (L2 must be clean)
        run: python scripts/audit.py example --tier L2
      - name: Minimal checker must be clean too
        run: python scripts/check.py example
